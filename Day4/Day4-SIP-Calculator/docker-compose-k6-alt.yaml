version: '3.8'

services:
  # InfluxDB for time-series metrics storage
  influxdb-alt:
    image: influxdb:1.8-alpine
    container_name: influxdb-k6-alt
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
      - INFLUXDB_USER=k6user
      - INFLUXDB_USER_PASSWORD=k6password
    ports:
      - '8087:8086'
    volumes:
      - influxdb_data_alt:/var/lib/influxdb
    networks:
      - k6-stack-alt
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8086/ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Grafana for visualization
  grafana-alt:
    image: grafana/grafana:latest
    container_name: grafana-k6-alt
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - '3001:3000'
    volumes:
      - ./grafana-alt/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-alt/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data_alt:/var/lib/grafana
    depends_on:
      - influxdb-alt
    networks:
      - k6-stack-alt
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 10

  # k6 load testing service
  k6-alt:
    image: grafana/k6:latest
    container_name: k6-runner-alt
    command: run /scripts/local-load-test.js --out influxdb=http://influxdb-alt:8086/k6
    volumes:
      - ./local-load-test.js:/scripts/local-load-test.js
    environment:
      - K6_VUS=10
      - K6_DURATION=1m
      - K6_OUT=influxdb=http://influxdb-alt:8086/k6
    networks:
      - k6-stack-alt
    depends_on:
      influxdb-alt:
        condition: service_healthy
    profiles:
      - test

volumes:
  influxdb_data_alt:
  grafana_data_alt:

networks:
  k6-stack-alt:
    driver: bridge
