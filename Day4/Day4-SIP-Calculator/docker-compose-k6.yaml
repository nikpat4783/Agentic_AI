version: '3.8'

services:
  # InfluxDB for time-series metrics storage
  influxdb:
    image: influxdb:1.8-alpine
    container_name: influxdb-k6
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin
      - INFLUXDB_USER=k6user
      - INFLUXDB_USER_PASSWORD=k6password
    ports:
      - '8086:8086'
    volumes:
      - influxdb_data:/var/lib/influxdb
    networks:
      - k6-stack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8086/ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-k6
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    ports:
      - '4000:3000'
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/dashboards/dashboardproviders.yaml:/etc/grafana/provisioning/dashboards/dashboardproviders.yaml
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    networks:
      - k6-stack
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 10

  # k6 load testing service
  k6:
    image: grafana/k6:latest
    container_name: k6-runner
    command: run /scripts/local-load-test.js --out influxdb=http://influxdb:8086/k6
    volumes:
      - ./local-load-test.js:/scripts/local-load-test.js
    environment:
      - K6_VUS=10
      - K6_DURATION=1m
      - K6_OUT=influxdb=http://influxdb:8086/k6
    networks:
      - k6-stack
    depends_on:
      influxdb:
        condition: service_healthy
    profiles:
      - test  # Run only when explicitly requested with --profile test

volumes:
  influxdb_data:
  grafana_data:

networks:
  k6-stack:
    driver: bridge
