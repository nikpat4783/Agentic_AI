version: '3.8'

services:
  # OpenTelemetry Collector (disabled - using direct app instrumentation)
  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   container_name: otel-collector
  #   command: ['--config=/etc/otel-collector-config.yaml']
  #   volumes:
  #     - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
  #   ports:
  #     - '4317:4317'   # OTLP gRPC receiver
  #     - '4318:4318'   # OTLP HTTP receiver
  #     - '8888:8888'   # Prometheus exporter
  #     - '13133:13133' # Health check
  #     - '55679:55679' # ZPages
  #   depends_on:
  #     - prometheus
  #     - tempo
  #     - jaeger
  #   environment:
  #     - LOG_LEVEL=debug
  #   networks:
  #     - observability

  # Prometheus for metrics storage
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - observability

  # Tempo for distributed tracing (disabled - using Jaeger for traces)
  # tempo:
  #   image: grafana/tempo:latest
  #   container_name: tempo
  #   command: ['-config.file=/etc/tempo.yaml']
  #   volumes:
  #     - ./tempo.yaml:/etc/tempo.yaml
  #     - tempo_data:/var/tempo
  #   ports:
  #     - '3200:3200'   # tempo
  #   networks:
  #     - observability

  # Jaeger for trace visualization (optional, for debugging)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - '6831:6831/udp'
      - '16686:16686' # Jaeger UI
      - '14250:14250' # gRPC receiver
    networks:
      - observability

  # Grafana for dashboards and visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - '4000:3000'
    networks:
      - observability
    depends_on:
      - prometheus

  # Optional: Loki for log aggregation
  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '3100:3100'
    networks:
      - observability

volumes:
  prometheus_data:
  tempo_data:
  grafana_data:

networks:
  observability:
    driver: bridge
